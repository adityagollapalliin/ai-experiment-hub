<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        AI Experiment Hub
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>

    <header class="navbar">

        <div class="container navbar-content">

            <a
                href="/dashboard"
                class="logo"
            >
                AI Experiment Hub
            </a>


            <nav>

                <a href="/dashboard">
                    Dashboard
                </a>

                <a href="/api/projects/">
                    Projects API
                </a>

                <a href="/api/experiments/">
                    Experiments API
                </a>

                <a href="/docs">
                    API Docs
                </a>

            </nav>

        </div>

    </header>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
